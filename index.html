    <!-- Marks the document as JavaScript-enabled before first paint, so scroll reveals
         hide content only when the page can reveal it (see [data-reveal] in src/index.css). -->
    <script>document.documentElement.classList.add("js");</script>
    <!-- Google tag (gtag.js) — measurement ID is also exported as GA_MEASUREMENT_ID in
         src/lib/analytics.ts for app code; this literal copy can't import that constant
         since it must run before any bundled JS, so keep both in sync when rotating IDs. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X3HQQ4CQDB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-X3HQQ4CQDB');
    </script>

    <!-- Microsoft Clarity — project ID also mirrored as CLARITY_PROJECT_ID in
         src/lib/analytics.ts, same constraint as the Google tag above.
         Note: fixed a typo present in the snippet as originally supplied —
         `c[a].q=c[a]||[]` threw "c[a].q.push is not a function" on every
         load (c[a] at that point is the queue function itself, not an
         array), silently breaking Clarity entirely. This is Microsoft's
         actual published snippet: `c[a].q=c[a].q||[]`. -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "ywohcflaev");
    </script>
